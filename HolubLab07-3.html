<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Анкета</title>
</head>
<body>
<h2>Завдання 2. Анкета за вказаним зразком</h2>
<form action="#">
<table border="1" cellpadding="8" cellspacing="2">
    <tr>
        <th colspan="3"><font color="red" size="6">Анкета</font></th>
    </tr>
    <tr><td>1.</td><td>Прізвище</td><td><input type="text" name="surname" size="35"></td></tr>
    <tr><td>2.</td><td>Ім'я, по батькові</td><td><input type="text" name="name" size="35"></td></tr>
    <tr><td>3.</td><td>Число і рік народження</td><td><input type="text" name="birth" size="35"></td></tr>
    <tr><td>4.</td><td>Домашня адреса</td><td><input type="text" name="address" size="35"></td></tr>
    <tr><td>5.</td><td>Місце навчання (роботи)</td><td><input type="text" name="study" size="35"></td></tr>
    <tr><td>6.</td><td>Домашній (робочий) телефон</td><td><input type="text" name="phone" size="35"></td></tr>
    <tr><td>7.</td><td>E-mail</td><td><input type="text" name="email" size="35"></td></tr>
    <tr>
        <td>8.</td>
        <td>Область наукових інтересів</td>
        <td>
            1. <input type="text" name="interest1" size="30"><br>
            2. <input type="text" name="interest2" size="30"><br>
            3. <input type="text" name="interest3" size="30"><br>
            4. <input type="text" name="interest4" size="30"><br>
            5. <input type="text" name="interest5" size="30"><br>
            6. <input type="text" name="interest6" size="30">
        </td>
    </tr>
    <tr>
        <td colspan="3">
            <input type="reset" value="Відмінити введення"><br><br>
            <input type="submit" value="Надіслати дані та перейти до 2 етапу реєстрації">
        </td>
    </tr>
</table>
</form>
</body>
</html>
